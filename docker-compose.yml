version: '3.8'

services:
  svtplayarr:
    build: .
    # container_name removed — EasyPanel scopes names to avoid collisions
    restart: unless-stopped
    # ports removed — use EasyPanel Domains tab instead (point at service "svtplayarr", port 2626)
    # ports:
    #   - "2626:2626"
    volumes:
      - ./config:/config
      - ${MOVIES_PATH:-./downloads/movies}:/downloads/movies
      - ${TV_PATH:-./downloads/tv}:/downloads/tv
    environment:
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SONARR_URL=${SONARR_URL}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_URL=${RADARR_URL}
      - INDEXER_API_KEY=${INDEXER_API_KEY}
      - MOVIES_PATH=/downloads/movies
      - TV_PATH=/downloads/tv
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - default
      - easypanel

networks:
  default:
  easypanel:
    external: true
